[project]
name = "parsai"
version = "0.1.0"
description = "Document parsing and chunking library"
readme = "README.md"
authors = [
    { name = "clamprinopoulou" }
]
requires-python = ">=3.13"
dependencies = [
    "docx2txt>=0.9",
    "markdown>=3.10",
    "pymupdf-layout>=1.26.6",
    "pymupdf4llm>=0.2.4",
    "python-pptx>=1.0.2",
    "requests>=2.32",
    "trafilatura>=2.2",
]

[dependency-groups]
dev = [
    "pytest>=7.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
parsai = "parsai.cli:main"
